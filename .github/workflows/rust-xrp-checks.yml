on:
  pull_request:
    paths:
      - rust/apps/xrp/**

name: XRP Checks

jobs:
  UnitTest:
    name: Unit Test And Code coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2

      - name: Read Rust toolchain
        run: echo "RUST_TOOLCHAIN=$(cat rust-toolchain)" >> $GITHUB_ENV

      - uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          override: true
          components: rustfmt
          target: x86_64-apple-darwin

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@c3076e6fa5aeb9a93daf1bd8eff73345250a8a9c # cargo-llvm-cov

      - name: Run rust/apps/xrp
        run: cd rust/apps/xrp && cargo +$RUST_TOOLCHAIN llvm-cov --fail-under-regions 84 --fail-under-functions 90 --fail-under-lines 93 --ignore-filename-regex 'keystore/*|utils/*'
